[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labclaw"
version = "0.0.1"
description = "Cloud Brain — unified gateway to 2400+ scientific tools"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "LabClaw Team" },
]
keywords = ["scientific-tools", "lab-automation", "mcp", "cloud-brain", "life-science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pyyaml>=6.0,<7.0",
    "slowapi>=0.1.9,<1.0.0",
    "mcp>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
tooluniverse = [
    "tooluniverse>=1.1.0; python_version>='3.11'",
]
llm = [
    "anthropic>=0.40.0,<1.0.0",
    "openai>=1.0.0,<3.0.0",
]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=6.0,<8.0",
    "httpx>=0.27.0,<1.0.0",
    "ruff>=0.6.0,<1.0.0",
    "mypy>=1.11,<2.0",
    "types-PyYAML>=6.0",
    "pre-commit>=4.0,<5.0",
    "build>=1.0,<2.0",
]
all = [
    "labclaw[tooluniverse,llm]",
]

[project.urls]
Homepage = "https://labclaw.org"
Documentation = "https://labclaw.github.io/labclaw/"
Repository = "https://github.com/labclaw/labclaw"
Issues = "https://github.com/labclaw/labclaw/issues"
Changelog = "https://github.com/labclaw/labclaw/blob/main/CHANGELOG.md"

[project.scripts]
labclaw = "labclaw.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks integration tests (real API calls)",
    "mcp: marks MCP server tests",
]

[tool.coverage.run]
source = ["labclaw"]
omit = [
    "*/tests/*",
    "*/integration/*",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "^\\s+\\.\\.\\.$",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
