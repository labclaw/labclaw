name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example: v0.0.2)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify-release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout selected tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git checkout "refs/tags/${{ inputs.tag }}"

      - name: Validate tag, version, changelog, and branch ancestry
        env:
          TARGET_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH. Got: $TARGET_TAG" >&2
            exit 1
          fi

          RELEASE_VERSION="${TARGET_TAG#v}"
          echo "Resolved release version: $RELEASE_VERSION"

          PROJECT_VERSION=$(python - <<'PY'
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )

          if [ "$PROJECT_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Tag/version mismatch: tag=$RELEASE_VERSION pyproject=$PROJECT_VERSION" >&2
            exit 1
          fi

          RELEASE_VERSION="$RELEASE_VERSION" python - <<'PY'
          import os
          import pathlib
          import re
          import sys

          version = os.environ["RELEASE_VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          if re.search(rf"^##\s+{re.escape(version)}\b", text, flags=re.MULTILINE) is None:
            print(f"CHANGELOG.md missing heading for version {version}", file=sys.stderr)
            sys.exit(1)
          PY

          git fetch --no-tags origin main
          TAG_SHA=$(git rev-list -n 1 "$TARGET_TAG")
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "Tag $TARGET_TAG is not reachable from origin/main" >&2
            exit 1
          fi

      - name: Setup uv
        uses: astral-sh/setup-uv@a2a8b00df0aa22a77a33ee5f956c2128661fabeb # v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --extra dev --extra science --extra ingest --extra nwb --frozen

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Mypy type check
        run: uv run mypy src/labclaw/

      - name: Run tests
        run: uv run pytest --cov=labclaw --cov-report=term-missing --cov-fail-under=100 -q

  build:
    name: build-release-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - verify

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Checkout selected tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git checkout "refs/tags/${{ inputs.tag }}"

      - name: Setup uv
        uses: astral-sh/setup-uv@a2a8b00df0aa22a77a33ee5f956c2128661fabeb # v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build distributions
        run: |
          rm -rf dist
          uv build --sdist --wheel

      - name: Check package metadata
        run: uvx twine check dist/*

      - name: Smoke test built wheel
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/labclaw-*.whl | head -n 1)
          uv pip install --system "$WHEEL"
          python - <<'PY'
          import labclaw
          print(labclaw.__version__)
          PY

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*

  github-release:
    name: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - build
    environment: release
    permissions:
      contents: write

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*

  publish-pypi:
    name: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - build
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1
        with:
          packages-dir: dist
